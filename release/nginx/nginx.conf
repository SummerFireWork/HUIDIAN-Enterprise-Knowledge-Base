# HUIDIAN 2.0 演示包 nginx 网关（唯一对外入口）
# 宿主 8081 -> nginx:80 -> kb-app:8080（前端静态 + API 同源代理）
# 中间件（PostgreSQL/MinIO/ES/RabbitMQ/Redis/BGE-M3 mock）不对外暴露端口，仅容器内网通信。

server {
    listen 80;
    server_name _;

    # 上传大文件（演示文档可达数百 MB）
    client_max_body_size 500m;

    # 安全响应头（iframe 预览需 SAMEORIGIN，不可用 DENY）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源压缩（前端 dist 打进 jar，经本代理下发）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 根路径重定向到应用前缀（后端 context-path=/api/v1，前端静态资源挂在 /api/v1/ 下）
    location = / {
        return 302 /api/v1/;
    }

    location / {
        proxy_pass http://kb-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # SSE 问答流（/api/v1/qa/chat）必须关闭缓冲，否则流式输出被截断
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
    }
}
