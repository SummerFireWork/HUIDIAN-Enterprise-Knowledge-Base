# HUIDIAN 2.0 一键演示环境（Docker Compose）
# 用法：docker compose up -d   （首次构建无需任何手工步骤，kb-app 内置前端页面）
# 访问：http://127.0.0.1:8081   （仅 nginx 网关对外暴露；前端 + API 同源；演示账号 admin/admin123）
# 服务：nginx(网关) / PG15 / MinIO / ES 8.17(IK) / RabbitMQ / Redis / BGE-M3 mock / kb-app(后端+前端一体)
# 安全说明：
#   * 中间件（PG/MinIO/ES/RabbitMQ/Redis/mock）不映射宿主端口，仅容器内网通信；
#   * 对象存储对象经 kb-app「内容直出」端点代理输出（预览/下载走 /api/v1/files/{id}/content），
#     因此 MinIO 无需对外暴露、无预签名过期问题；
#   * 仅用于本地演示，全部为演示凭据；生产部署请注入真实密钥（见 ROADMAP / ADR）。
services:
  postgres:
    image: postgres:15-alpine
    container_name: kb-pg
    environment:
      POSTGRES_DB: huidian
      POSTGRES_USER: huidian
      POSTGRES_PASSWORD: huidian-demo-2026
    volumes:
      - kb-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huidian -d huidian"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: kb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: huidian
      MINIO_ROOT_PASSWORD: huidian-minio-2026
    volumes:
      - kb-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: kb-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: trial
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - kb-es-data:/usr/share/elasticsearch/data
      - ./es/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./es/plugins/analysis-ik:/usr/share/elasticsearch/plugins/analysis-ik:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: kb-mq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    volumes:
      - kb-mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  bge-m3-mock:
    image: python:3.11-slim
    container_name: kb-bge-m3-mock
    command: python /app/server.py
    volumes:
      - ./bge-m3-mock/server.py:/app/server.py
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/info')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- kb-app：后端 + 前端一体化（编译产物，无源码）----
  # 使用 dev 演示 profile：本地 text-extract 解析（无需解析引擎容器）、mock 向量、免登录调试
  kb-app:
    image: eclipse-temurin:21-jre
    container_name: kb-app
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      bge-m3-mock: { condition: service_healthy }
    environment:
      KB_PROFILE: dev
      KB_DB_USER: huidian
      KB_DB_PASSWORD: huidian-demo-2026
      KB_DB_URL: jdbc:postgresql://postgres:5432/huidian
      KB_MINIO_ENDPOINT: http://minio:9000
      KB_MINIO_ACCESS_KEY: huidian
      KB_MINIO_SECRET_KEY: huidian-minio-2026
      KB_ES_URIS: http://elasticsearch:9200
      KB_MQ_HOST: rabbitmq
      KB_MQ_PORT: "5672"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      KB_BGE_M3_URL: http://bge-m3-mock:8000
      KB_REDIS_HOST: redis
      KB_JWT_SECRET: huidian-demo-secret-at-least-32-chars-2026   # 仅演示；生产由部署注入
    command: ["java", "-jar", "/app/huidian-kb.jar"]
    volumes:
      - ./release/huidian-kb.jar:/app/huidian-kb.jar:ro
      - kb-app-logs:/var/log/huidian
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---- nginx 网关：唯一对外入口（宿主 8081 -> nginx:80 -> kb-app:8080）----
  kb-nginx:
    image: nginx:1.27-alpine
    container_name: kb-nginx
    depends_on:
      kb-app: { condition: service_healthy }
    ports:
      - "8081:80"     # 唯一对外端口（本机访问：http://127.0.0.1:8081 前端 + API）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  kb-pg-data:
  kb-minio-data:
  kb-es-data:
  kb-mq-data:
  kb-app-logs:
