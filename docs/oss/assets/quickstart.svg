<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081d31"/>
      <stop offset="1" stop-color="#0B3D5C"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#35C2E4"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <circle cx="1500" cy="80" r="220" fill="#35C2E4" opacity="0.06"/>

  <text x="80" y="64" font-size="32" font-weight="700" fill="#ffffff">Local Reproduction in 5 Minutes · 3 Steps</text>
  <text x="82" y="96" font-size="16" fill="#9fc3dd">Docker orchestration → build &amp; run backend → build &amp; run frontend（demo account: admin / admin123）</text>

  <!-- Step 1 -->
  <g transform="translate(80,150)" filter="url(#shadow)">
    <rect width="340" height="300" rx="16" fill="url(#step)" stroke="#3d6e92" stroke-width="1.5"/>
    <rect width="340" height="56" rx="16" fill="#1F6FB2"/>
    <text x="24" y="25" font-size="15" font-weight="700" fill="#ffffff">① Middleware (Docker)</text>
    <text x="24" y="46" font-size="12.5" fill="#d7e7f5">One-command infrastructure bootstrap</text>
    <g font-size="13" fill="#dceaf5">
      <text x="24" y="90" fill="#35C2E4" font-weight="600">docker compose -f backend/docker/compose.yml up -d</text>
      <text x="24" y="118" fill="#9fc3dd">· PostgreSQL 15 (metadata / Flyway)</text>
      <text x="24" y="142" fill="#9fc3dd">· Elasticsearch 8.17 (dual indices + IK)</text>
      <text x="24" y="166" fill="#9fc3dd">· MinIO (objects + presigned URLs)</text>
      <text x="24" y="190" fill="#9fc3dd">· RabbitMQ / Redis / BGE-M3 Mock</text>
      <text x="24" y="226" fill="#F5B942">Proceed once all health checks are green</text>
      <text x="24" y="252" fill="#8fb6cf">Ports: 5432 / 9211 / 9000 / 5672 / 6379 / 8000</text>
      <text x="24" y="280" fill="#8fb6cf">(9211 avoids a busy host 9200, see compose notes)</text>
    </g>
  </g>

  <!-- Step 2 -->
  <g transform="translate(450,150)" filter="url(#shadow)">
    <rect width="340" height="300" rx="16" fill="url(#step)" stroke="#3d6e92" stroke-width="1.5"/>
    <rect width="340" height="56" rx="16" fill="#1F6FB2"/>
    <text x="24" y="25" font-size="15" font-weight="700" fill="#ffffff">② Build &amp; Run Backend</text>
    <text x="24" y="46" font-size="12.5" fill="#d7e7f5">Java 21 · Spring Boot 3.5 · Maven multi-module</text>
    <g font-size="13" fill="#dceaf5">
      <text x="24" y="90" fill="#35C2E4" font-weight="600">cd backend</text>
      <text x="24" y="112" fill="#35C2E4" font-weight="600">mvn -pl kb-bootstrap -am package -DskipTests</text>
      <text x="24" y="142" fill="#9fc3dd">Artifact: kb-bootstrap/target/luzhitong-kb.jar</text>
      <text x="24" y="166" fill="#9fc3dd">Run (dev, host 8080):</text>
      <text x="24" y="188" fill="#9fc3dd">java -jar luzhitong-kb.jar --spring.profiles.active=dev</text>
      <text x="24" y="212" fill="#9fc3dd">Container (8081): docker compose up kb-app</text>
      <text x="24" y="244" fill="#F5B942">Verify: curl localhost:8080/api/v1/actuator/health</text>
      <text x="24" y="270" fill="#8fb6cf">Env vars KB_DB_* / KB_ES_URIS / KB_MINIO_* — see README</text>
    </g>
  </g>

  <!-- Step 3 -->
  <g transform="translate(820,150)" filter="url(#shadow)">
    <rect width="340" height="300" rx="16" fill="url(#step)" stroke="#3d6e92" stroke-width="1.5"/>
    <rect width="340" height="56" rx="16" fill="#1F6FB2"/>
    <text x="24" y="25" font-size="15" font-weight="700" fill="#ffffff">③ Build &amp; Run Frontend</text>
    <text x="24" y="46" font-size="12.5" fill="#d7e7f5">Vue 3 + TypeScript + Vite + Element Plus</text>
    <g font-size="13" fill="#dceaf5">
      <text x="24" y="90" fill="#35C2E4" font-weight="600">cd frontend</text>
      <text x="24" y="112" fill="#35C2E4" font-weight="600">pnpm install</text>
      <text x="24" y="134" fill="#35C2E4" font-weight="600">pnpm gen:api （contract gen from api-docs.json）</text>
      <text x="24" y="158" fill="#35C2E4" font-weight="600">pnpm dev</text>
      <text x="24" y="186" fill="#9fc3dd">Open http://localhost:5173（/api/v1 proxied to 8081）</text>
      <text x="24" y="210" fill="#9fc3dd">Production: pnpm build → dist/ (nginx sample in frontend README)</text>
      <text x="24" y="244" fill="#F5B942">Demo account: admin / admin123</text>
      <text x="24" y="270" fill="#8fb6cf">SSE Q&amp;A needs nginx proxy_buffering off</text>
    </g>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1190,150)" filter="url(#shadow)">
    <rect width="330" height="300" rx="16" fill="url(#step)" stroke="#3d6e92" stroke-width="1.5"/>
    <rect width="330" height="56" rx="16" fill="#E8930C"/>
    <text x="24" y="25" font-size="15" font-weight="700" fill="#ffffff">④ End-to-End Demo</text>
    <text x="24" y="46" font-size="12.5" fill="#fbeedc">One full pipeline to verify</text>
    <g font-size="13" fill="#dceaf5">
      <text x="24" y="90" fill="#F5B942" font-weight="600">Upload a document (pick classification)</text>
      <text x="24" y="112" fill="#9fc3dd">Chunked upload → parse → review → index</text>
      <text x="24" y="138" fill="#F5B942" font-weight="600">Search (BM25 + KNN + RRF)</text>
      <text x="24" y="160" fill="#9fc3dd">Facets · highlight · page-level anchoring</text>
      <text x="24" y="186" fill="#F5B942" font-weight="600">RAG Q&amp;A (SSE streaming)</text>
      <text x="24" y="208" fill="#9fc3dd">Answers with citations · session groups</text>
      <text x="24" y="234" fill="#F5B942" font-weight="600">Statistics dashboard</text>
      <text x="24" y="256" fill="#9fc3dd">Assets · search heat · project aggregation</text>
      <text x="24" y="282" fill="#8fb6cf">Smoke scripts: backend/docker/smoke-*.py</text>
    </g>
  </g>

  <!-- Arrows -->
  <line x1="420" y1="300" x2="450" y2="300" stroke="#35C2E4" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="790" y1="300" x2="820" y2="300" stroke="#35C2E4" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1160" y1="300" x2="1190" y2="300" stroke="#35C2E4" stroke-width="4" marker-end="url(#arr)"/>

  <!-- Verification bar -->
  <rect x="80" y="500" width="1440" height="90" rx="14" fill="#0e3a5c" stroke="#35C2E4" stroke-width="1.2"/>
  <text x="112" y="532" font-size="15" font-weight="700" fill="#35C2E4">Post-boot Verification Checklist</text>
  <text x="112" y="558" font-size="13.5" fill="#dceaf5">✓ Backend health UP (db/es/minio/mq/redis all green)　✓ Uploaded file reaches INDEXED and is searchable　✓ /search returns 200 with ACL filtering　✓ /qa/chat streams answer→done events</text>
  <text x="112" y="580" font-size="13.5" fill="#dceaf5">✓ Presigned URL opens the original PDF　✓ RabbitMQ queues stay at zero backlog (console :15672)　✓ Admin can configure classification tabs / members / approvals</text>
</svg>
