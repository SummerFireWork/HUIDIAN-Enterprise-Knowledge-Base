<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081d31"/>
      <stop offset="1" stop-color="#0B3D5C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35C2E4"/>
      <stop offset="1" stop-color="#1F6FB2"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#E8930C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#7fd4ef"/>
    </marker>
    <marker id="arrGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F5B942"/>
    </marker>
  </defs>

  <rect width="1600" height="1160" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="240" fill="#35C2E4" opacity="0.06"/>
  <circle cx="180" cy="1060" r="300" fill="#1F6FB2" opacity="0.08"/>

  <!-- ============ Title ============ -->
  <text x="80" y="64" font-size="34" font-weight="700" fill="#ffffff">HUIDIAN 2.0 · Enterprise Knowledge Base — System Architecture</text>
  <text x="82" y="96" font-size="16" fill="#9fc3dd">Search-first + RAG Q&amp;A · Modular monolith (Spring Boot) · Pilot deployment for a 50-person design institute</text>

  <!-- ============ Layer 1: Presentation ============ -->
  <rect x="60" y="128" width="1480" height="150" rx="18" fill="url(#panel)" stroke="#3d6e92" stroke-width="1.5"/>
  <text x="88" y="158" font-size="15" font-weight="600" fill="#35C2E4">Presentation Layer</text>
  <g font-size="13.5" fill="#dceaf5">
    <g transform="translate(100,172)">
      <rect width="320" height="70" rx="12" fill="#0e3a5c"/>
      <text x="18" y="22" font-weight="600" fill="#ffffff">Web Client (Vue 3 + TS)</text>
      <text x="18" y="42" fill="#9fc3dd">Global search · KBs · Preview · Dashboard</text>
      <text x="18" y="60" fill="#9fc3dd">ECharts · Element Plus design system</text>
    </g>
    <g transform="translate(440,172)">
      <rect width="320" height="70" rx="12" fill="#0e3a5c"/>
      <text x="18" y="22" font-weight="600" fill="#ffffff">PDF Original-Text Preview</text>
      <text x="18" y="42" fill="#9fc3dd">Search hit → page-level anchor / bbox</text>
      <text x="18" y="60" fill="#9fc3dd">Content direct-output · Range loading</text>
    </g>
    <g transform="translate(780,172)">
      <rect width="320" height="70" rx="12" fill="#0e3a5c"/>
      <text x="18" y="22" font-weight="600" fill="#ffffff">RAG Q&amp;A (SSE streaming)</text>
      <text x="18" y="42" fill="#9fc3dd">event:answer / done / error</text>
      <text x="18" y="60" fill="#9fc3dd">Citation traceability · session groups</text>
    </g>
    <g transform="translate(1120,172)">
      <rect width="320" height="70" rx="12" fill="#0e3a5c"/>
      <text x="18" y="22" font-weight="600" fill="#ffffff">Stats &amp; Project Dashboard</text>
      <text x="18" y="42" fill="#9fc3dd">Materialized views · metric boards</text>
      <text x="18" y="60" fill="#9fc3dd">Multi-dimensional KB / file / member stats</text>
    </g>
    <!-- Nginx Gateway strip -->
    <g transform="translate(100,252)">
      <rect width="1360" height="26" rx="8" fill="#0e3a5c" stroke="#F5B942" stroke-width="1.2"/>
      <text x="16" y="17" font-size="12.5" font-weight="600" fill="#F5B942">Nginx Gateway · single entry :8081</text>
      <text x="300" y="17" font-size="12.5" fill="#dceaf5">frontend static + REST + SSE (no buffering) + content direct-output</text>
      <text x="1000" y="17" font-size="12.5" fill="#9fc3dd">middleware ports closed</text>
    </g>
  </g>

  <line x1="800" y1="278" x2="800" y2="318" stroke="#7fd4ef" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ============ Layer 2: API & Cross-cutting ============ -->
  <rect x="60" y="320" width="1480" height="120" rx="18" fill="url(#panel)" stroke="#3d6e92" stroke-width="1.5"/>
  <text x="88" y="350" font-size="15" font-weight="600" fill="#35C2E4">API &amp; Cross-cutting</text>
  <g font-size="13.5" fill="#dceaf5">
    <g transform="translate(100,362)">
      <rect width="340" height="58" rx="10" fill="#0e3a5c"/>
      <text x="16" y="24" font-weight="600" fill="#ffffff">REST /api/v1</text>
      <text x="16" y="45" fill="#9fc3dd">67 paths · openapi-generator contract</text>
    </g>
    <g transform="translate(460,362)">
      <rect width="320" height="58" rx="10" fill="#0e3a5c"/>
      <text x="16" y="24" font-weight="600" fill="#ffffff">JWT Auth + ACL Hard Filter</text>
      <text x="16" y="45" fill="#9fc3dd">AuthInterceptor · permission on every route</text>
    </g>
    <g transform="translate(800,362)">
      <rect width="320" height="58" rx="10" fill="#0e3a5c"/>
      <text x="16" y="24" font-weight="600" fill="#ffffff">Unified Response / Errors / Audit</text>
      <text x="16" y="45" fill="#9fc3dd">ApiResponse · 7 error codes · operation audit</text>
    </g>
    <g transform="translate(1140,362)">
      <rect width="340" height="58" rx="10" fill="#0e3a5c"/>
      <text x="16" y="24" font-weight="600" fill="#ffffff">OpenAPI / Swagger UI</text>
      <text x="16" y="45" fill="#9fc3dd">api-docs.json as single source of truth</text>
    </g>
  </g>

  <line x1="800" y1="440" x2="800" y2="480" stroke="#7fd4ef" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ============ Layer 3: Business ============ -->
  <rect x="60" y="482" width="1480" height="430" rx="18" fill="url(#panel)" stroke="#3d6e92" stroke-width="1.5"/>
  <text x="88" y="512" font-size="15" font-weight="600" fill="#35C2E4">Business Layer · Modular Monolith (Maven multi-module)</text>

  <!-- Domain A: Knowledge Production -->
  <g transform="translate(100,530)">
    <rect width="680" height="172" rx="14" fill="#0e3a5c" stroke="#1F6FB2" stroke-width="1.2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#F5B942">Knowledge Production · Parse &amp; Ingest</text>
    <g transform="translate(16,42)">
      <rect width="300" height="108" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">File Upload (chunked, resumable)</text>
      <text x="14" y="44" fill="#9fc3dd">MD5 instant upload · chunk merge</text>
      <text x="14" y="64" fill="#9fc3dd">Classification tabs (type + attrs)</text>
      <text x="14" y="84" fill="#9fc3dd">Review chain REVIEWING→INDEXED</text>
    </g>
    <g transform="translate(332,42)">
      <rect width="332" height="108" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">Parsing Pipeline (Parser SPI)</text>
      <text x="14" y="44" fill="#9fc3dd">Dual-engine adapters · quality gates</text>
      <text x="14" y="64" fill="#9fc3dd">TreeBasedChunker heading anchors</text>
      <text x="14" y="84" fill="#9fc3dd">Single source of truth: result.json</text>
    </g>
  </g>

  <!-- Domain B: Knowledge Consumption -->
  <g transform="translate(800,530)">
    <rect width="720" height="172" rx="14" fill="#0e3a5c" stroke="#1F6FB2" stroke-width="1.2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#F5B942">Knowledge Consumption · Search &amp; Q&amp;A</text>
    <g transform="translate(16,42)">
      <rect width="332" height="108" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">Hybrid Search (BM25 + KNN + RRF)</text>
      <text x="14" y="44" fill="#9fc3dd">IK tokenizer · semantic vectors · fusion</text>
      <text x="14" y="64" fill="#9fc3dd">ACL hard filter · faceted aggregation</text>
      <text x="14" y="84" fill="#9fc3dd">searchAfter deep pagination · highlight</text>
    </g>
    <g transform="translate(368,42)">
      <rect width="332" height="108" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">RAG Q&amp;A (Spring AI)</text>
      <text x="14" y="44" fill="#9fc3dd">Retrieval-augmented · citations · SSE</text>
      <text x="14" y="64" fill="#9fc3dd">DashScope qwen (Mock fallback)</text>
      <text x="14" y="84" fill="#9fc3dd">Answers always cite sources</text>
    </g>
  </g>

  <!-- Domain C: Governance & Ops -->
  <g transform="translate(100,716)">
    <rect width="680" height="176" rx="14" fill="#0e3a5c" stroke="#1F6FB2" stroke-width="1.2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#F5B942">Knowledge Governance · Permissions &amp; Ops</text>
    <g transform="translate(16,42)">
      <rect width="300" height="112" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">KB &amp; Permissions (ACL)</text>
      <text x="14" y="44" fill="#9fc3dd">Tiers: PERSONAL / DEPT / PUBLIC</text>
      <text x="14" y="64" fill="#9fc3dd">4 roles · apply / invite / approve</text>
      <text x="14" y="84" fill="#9fc3dd">ACL dual-written to PG + ES</text>
    </g>
    <g transform="translate(332,42)">
      <rect width="332" height="112" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">Ops &amp; Maintenance</text>
      <text x="14" y="44" fill="#9fc3dd">M12 runbook · RabbitMQ backlog</text>
      <text x="14" y="64" fill="#9fc3dd">PG / ES / MinIO reconciliation</text>
      <text x="14" y="84" fill="#9fc3dd">Eval-set regression · search audit</text>
    </g>
  </g>

  <!-- Domain D: Data Assets -->
  <g transform="translate(800,716)">
    <rect width="720" height="176" rx="14" fill="#0e3a5c" stroke="#1F6FB2" stroke-width="1.2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#F5B942">Data Assets · Stats &amp; Projects</text>
    <g transform="translate(16,42)">
      <rect width="332" height="112" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">Statistics (materialized views)</text>
      <text x="14" y="44" fill="#9fc3dd">File / KB / member / search metrics</text>
      <text x="14" y="64" fill="#9fc3dd">Daily materialization · async refresh</text>
      <text x="14" y="84" fill="#9fc3dd">Dashboard data · audit reports</text>
    </g>
    <g transform="translate(368,42)">
      <rect width="332" height="112" rx="10" fill="#0b3350"/>
      <text x="14" y="22" font-weight="600" fill="#ffffff">Project Aggregation</text>
      <text x="14" y="44" fill="#9fc3dd">File ↔ project links · knowledge packs</text>
      <text x="14" y="64" fill="#9fc3dd">Project-scoped search &amp; stats</text>
      <text x="14" y="84" fill="#9fc3dd">Similar cases (planned)</text>
    </g>
  </g>

  <line x1="800" y1="912" x2="800" y2="952" stroke="#7fd4ef" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ============ Layer 4: Infrastructure ============ -->
  <rect x="60" y="954" width="1480" height="130" rx="18" fill="url(#panel)" stroke="#3d6e92" stroke-width="1.5"/>
  <text x="88" y="984" font-size="15" font-weight="600" fill="#35C2E4">Infrastructure · One-command Docker Compose</text>
  <g font-size="13" fill="#dceaf5">
    <g transform="translate(100,996)">
      <rect width="210" height="66" rx="10" fill="#0e3a5c"/>
      <text x="14" y="23" font-weight="600" fill="#ffffff">PostgreSQL 15</text>
      <text x="14" y="44" fill="#9fc3dd">Metadata · Flyway migrations</text>
    </g>
    <g transform="translate(326,996)">
      <rect width="210" height="66" rx="10" fill="#0e3a5c"/>
      <text x="14" y="23" font-weight="600" fill="#ffffff">Elasticsearch 8.17</text>
      <text x="14" y="44" fill="#9fc3dd">Dual indices · BM25+IK · KNN</text>
    </g>
    <g transform="translate(552,996)">
      <rect width="210" height="66" rx="10" fill="#0e3a5c"/>
      <text x="14" y="23" font-weight="600" fill="#ffffff">MinIO</text>
      <text x="14" y="44" fill="#9fc3dd">Object storage · internal (app-proxied)</text>
    </g>
    <g transform="translate(778,996)">
      <rect width="210" height="66" rx="10" fill="#0e3a5c"/>
      <text x="14" y="23" font-weight="600" fill="#ffffff">RabbitMQ</text>
      <text x="14" y="44" fill="#9fc3dd">Event-driven parsing pipeline</text>
    </g>
    <g transform="translate(1004,996)">
      <rect width="210" height="66" rx="10" fill="#0e3a5c"/>
      <text x="14" y="23" font-weight="600" fill="#ffffff">Redis</text>
      <text x="14" y="44" fill="#9fc3dd">Cache · distributed state</text>
    </g>
    <g transform="translate(1230,996)">
      <rect width="210" height="66" rx="10" fill="#0e3a5c"/>
      <text x="14" y="23" font-weight="600" fill="#ffffff">BGE-M3 (Mock)</text>
      <text x="14" y="44" fill="#9fc3dd">Embedding · no-GPU demo fallback</text>
    </g>
  </g>

  <!-- ============ Data flows (top right) ============ -->
  <g transform="translate(1240,100)">
    <rect width="300" height="200" rx="12" fill="#0e3a5c" stroke="#35C2E4" stroke-width="1.2"/>
    <text x="18" y="28" font-size="13.5" font-weight="700" fill="#35C2E4">Core Data Flows</text>
    <circle cx="22" cy="52" r="9" fill="#35C2E4"/><text x="40" y="57" font-size="12.5" fill="#dceaf5">Upload → Parse → Chunk → Embed → Index</text>
    <circle cx="22" cy="80" r="9" fill="#F5B942"/><text x="40" y="85" font-size="12.5" fill="#dceaf5">Search: BM25 + KNN → RRF fusion</text>
    <circle cx="22" cy="108" r="9" fill="#F5B942"/><text x="40" y="113" font-size="12.5" fill="#dceaf5">Q&amp;A: retrieval-augmented → SSE + cites</text>
    <circle cx="22" cy="136" r="9" fill="#7fd4ef"/><text x="40" y="141" font-size="12.5" fill="#dceaf5">ACL dual-write PG + ES (hard filter)</text>
    <circle cx="22" cy="164" r="9" fill="#7fd4ef"/><text x="40" y="169" font-size="12.5" fill="#dceaf5">Preview: app-proxied content (HTTP Range)</text>
    <text x="18" y="192" font-size="12" fill="#8fb6cf">Index aliases: kb_chunk_alias_v1 / kb_doc_alias</text>
  </g>

  <!-- Legend (bottom left) -->
  <g transform="translate(100,1100)">
    <rect width="90" height="16" rx="4" fill="#0e3a5c" stroke="#1F6FB2"/><text x="104" y="15" font-size="13" fill="#dceaf5">Domain card</text>
    <rect x="220" y="0" width="90" height="16" rx="4" fill="#0b3350"/><text x="324" y="15" font-size="13" fill="#dceaf5">Module</text>
    <rect x="410" y="0" width="16" height="16" rx="4" fill="url(#accent)"/><text x="440" y="15" font-size="13" fill="#dceaf5">Layer flow</text>
    <rect x="540" y="0" width="16" height="16" rx="4" fill="url(#accentGold)"/><text x="570" y="15" font-size="13" fill="#dceaf5">Search / Q&amp;A path</text>
  </g>
</svg>
