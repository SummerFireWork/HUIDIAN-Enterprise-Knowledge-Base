<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Screenshot placeholder template: replace per docs/oss/README.md checklist -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6f9"/>
      <stop offset="1" stop-color="#e8edf3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FB2"/>
      <stop offset="1" stop-color="#0B3D5C"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d7e0ea" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.5"/>
  <!-- Browser bar -->
  <rect x="0" y="0" width="1280" height="44" fill="url(#bar)"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="66" cy="22" r="6" fill="#28c840"/>
  <rect x="96" y="12" width="420" height="20" rx="10" fill="#ffffff" opacity="0.18"/>
  <text x="308" y="26" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.85">HUIDIAN · system UI screenshot placeholder</text>
  <!-- Body -->
  <g transform="translate(0, 44)">
    <rect x="0" y="0" width="1280" height="676" fill="#ffffff" opacity="0.0"/>
    <g transform="translate(580, 190)">
      <rect x="0" y="0" width="120" height="92" rx="14" fill="#c9d6e4"/>
      <rect x="8" y="6" width="104" height="80" rx="9" fill="#eef3f8" stroke="#b7c6d6" stroke-width="2"/>
      <rect x="34" y="-10" width="52" height="16" rx="5" fill="#c9d6e4"/>
      <circle cx="60" cy="46" r="22" fill="#ffffff" stroke="#b7c6d6" stroke-width="2"/>
      <circle cx="60" cy="46" r="9" fill="#8ea9c4"/>
    </g>
    <text x="640" y="330" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="600" fill="#33475b" text-anchor="middle">Screenshot Placeholder（to be replaced）</text>
    <text x="640" y="372" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#66788f" text-anchor="middle">Place the real system UI screenshot here</text>
    <rect x="390" y="402" width="500" height="56" rx="12" fill="#ffffff" stroke="#b7c6d6" stroke-width="1.5"/>
    <text x="640" y="426" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" fill="#33475b" text-anchor="middle">Suggested size 1280×720 (16:9), PNG / JPG</text>
    <text x="640" y="448" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" fill="#33475b" text-anchor="middle">Replacement checklist in docs/oss/README.md</text>
    <text x="640" y="560" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a99ad" text-anchor="middle">screenshot-placeholder.svg · swap this reference for the real screenshot file</text>
  </g>
</svg>
